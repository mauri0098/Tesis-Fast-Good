<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fast Good — Combos</title>
  <link rel="icon" href="../src/assets/img/logo.webp" type="image/webp"/>
  <!-- Evita el flash de contenido sin estilos (FOUC): el body se muestra cuando la página terminó de cargar -->
  <style>
    body { visibility: hidden; opacity: 0; transition: opacity 0.15s ease-in; }
    body.cargada { visibility: visible; opacity: 1; }
  </style>
  <!-- Letra: Inter, la del panel (20/10; el index sigue con Figtree). Poppins queda porque el CSS propio de esta pantalla todavía la usa -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/css/global.css">
  <!-- Mismo estilo que Gestión de Stock (tabla, ventanas y botones), sin cambiarlo -->
  <link rel="stylesheet" href="../src/css/stock.css">
  <!-- Lo propio de esta pantalla -->
  <link rel="stylesheet" href="../src/css/combos.css">
</head>

<body>
<!-- Permisos de la pantalla (roles 6 y 5), menú lateral y llamadas con sesión -->
<script src="../src/js/roles.js"></script>
<script src="../src/js/guard.js"></script>
<script src="../src/js/api.js"></script>
<script src="../src/js/escape.js"></script>
<script src="../src/js/adminSidebar.js"></script>

<div class="admin-content">

  <header>
    <div class="container-centrado">
      <div style="display:flex; align-items:center; gap:1rem;">
        <img src="../src/assets/img/logo.webp" alt="Fast Good" style="height:40px; border-radius:4px;" onerror="this.style.display='none'">
        <h1>Combos</h1>
      </div>
    </div>
  </header>

  <main class="page-container">
    <div class="table-wrapper">

      <div class="tabla-header">
        <!-- Avisos de la pantalla (combo creado, error al guardar…): los escribe gestionCombos.js -->
        <p id="avisoCombos" class="aviso-combos" role="status"></p>
        <button class="btn-nuevo-insumo" onclick="abrirFormularioCombo(null)">+ Nuevo combo</button>
      </div>

      <table class="standard-table tabla-combos">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Plan</th>
            <th>Viandas</th>
            <th>Precio</th>
            <th>Menú</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="combosBody">
          <tr>
            <td colspan="7" class="loading-text">Cargando combos...</td>
          </tr>
        </tbody>
      </table>

    </div>
  </main>

  <!-- VENTANA: Nuevo combo / Editar combo (la maneja gestionCombos.js) -->
  <div id="modalCombo" class="modal">
    <div class="modal-content modal-stock">
      <span class="close" data-accion="cerrar">&times;</span>
      <h3 id="mcTitulo">Nuevo combo</h3>

      <div class="modal-grid">
        <label for="mcNombre">Nombre *</label>
        <input id="mcNombre" type="text" maxlength="100" placeholder="Ej: Keto x10">

        <label for="mcPlan">Plan *</label>
        <select id="mcPlan">
          <option value="">Elegí un plan...</option>
        </select>

        <label for="mcCantidad">Viandas *</label>
        <input id="mcCantidad" type="number" min="1" max="100" step="1" placeholder="Ej: 10">

        <label for="mcPrecio">Precio *</label>
        <input id="mcPrecio" type="number" min="0" max="9999999" step="0.01" placeholder="Ej: 137000">
      </div>

      <!-- Avisos del formulario: plan desactivado y cantidad bloqueada (si el combo ya se vendió) -->
      <p id="mcNotaPlan" class="nota-combo" hidden></p>
      <p id="mcNotaVendido" class="nota-combo" hidden></p>

      <div id="mcError" class="modal-error"></div>

      <div class="modal-actions">
        <button class="btn-cancelar" data-accion="cerrar">Cancelar</button>
        <button class="btn-confirmar" id="mcGuardar" onclick="guardarCombo()">Guardar</button>
      </div>
    </div>
  </div>

  <!-- VENTANA: Menú de un combo (la maneja gestionCombos.js: abrirMenuCombo, agregarPlatoAlMenu, quitarPlatoDelMenu) -->
  <div id="modalMenu" class="modal">
    <div class="modal-content modal-stock modal-menu">
      <span class="close" data-accion="cerrar">&times;</span>
      <h3 id="mmTitulo">Menú del combo</h3>

      <!-- Avisos de la ventana (plato agregado, sacado o error) -->
      <p id="mmAviso" class="aviso-combos" role="status"></p>

      <!-- Si el menú queda vacío, el combo no se ve en la web -->
      <p id="mmVacio" class="nota-combo" hidden>Sin platos: el combo no se ve en la web. Agregá al menos uno.</p>

      <table class="tabla-menu">
        <thead>
          <tr>
            <th>Código</th>
            <th>Plato</th>
            <th>Plan</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="mmPlatos"></tbody>
      </table>

      <!-- Agregar un plato (de cualquier plan) -->
      <div class="fila-agregar">
        <label for="mmDisponibles">Agregar:</label>
        <select id="mmDisponibles"></select>
        <button class="btn-confirmar" id="mmAgregar" onclick="agregarPlatoAlMenu()">Agregar</button>
      </div>

      <div class="modal-actions">
        <button class="btn-cancelar" data-accion="cerrar">Cerrar</button>
      </div>
    </div>
  </div>

  <script src="../src/js/gestionCombos.js"></script>

</div> <!-- /.admin-content -->
<script>
  // Muestra el body apenas están el HTML y el CSS; a los 2 s se muestra igual, como respaldo
  document.addEventListener('DOMContentLoaded', () => document.body.classList.add('cargada'));
  setTimeout(() => document.body.classList.add('cargada'), 2000);
</script>
</body>

</html>
