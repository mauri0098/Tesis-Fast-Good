<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Formulario de Entrega - Fast Good</title>
  <!-- Evita el flash de contenido sin estilos (FOUC): el body se muestra cuando la página terminó de cargar -->
  <style>
    body { visibility: hidden; opacity: 0; transition: opacity 0.15s ease-in; }
    body.cargada { visibility: visible; opacity: 1; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/css/formulario.css">
  <link rel="icon" href="../src/assets/img/logo.webp" type="image/png">

</head>

<body>
  <div class="container">
    <h2>Datos para la Entrega</h2>

    <div class="pedido-resumen">
      <h3>🛒 Resumen de tu Pedido</h3>
      <ul id="resumenPedido"></ul>
    </div>

    <form id="pedidoForm">

      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" required>

      <label for="apellido">Apellido</label>
      <input type="text" id="apellido" required>

      <label for="direccion">Dirección</label>
      <input type="text" id="direccion" required>

      <label for="telefono">Teléfono</label>
      <input type="tel" id="telefono" required>

      <label for="email">Email (opcional)</label>
      <input type="email" id="email">

      <label for="fecha">Fecha de entrega</label>
      <input type="date" id="fecha" required>
      <p class="aviso-entrega">
        🕒 Tu pedido se elabora el día hábil siguiente al que lo hacés y se entrega al otro día hábil (48 hs hábiles).
        Ejemplo: si pedís un martes, se cocina el miércoles y te llega el jueves.
      </p>

      <label for="metodoPago">Método de Pago</label>
      <select id="metodoPago" required>
        <option value="Efectivo">Efectivo</option>
        <option value="Transferencia">Transferencia</option>
      </select>

      <label for="tipoEntrega">Tipo de Entrega</label>
      <select id="tipoEntrega" required onchange="toggleBarrio()">
        <option value="Delivery">Delivery</option>
        <option value="Retiro en local">Retiro en local</option>
      </select>

      <div id="grupoBarrio">
        <label for="barrio">Barrio de entrega</label>
        <select id="barrio" required style="width:100%; padding:0.75rem; margin-top:0.5rem; border:1px solid #ccc; border-radius:8px; font-size:1rem; font-family:'Poppins',sans-serif;">
          <option value="">Seleccioná tu barrio...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="observaciones">Observaciones <span style="font-weight: normal;">(opcional)</span></label>
        <textarea id="observaciones" rows="4" placeholder="Ej: Que el pollo al disco no tenga cebolla"
          class="campo-observaciones"></textarea>
      </div>




      <button type="submit">Finalizar Pedido</button>
      <a href="../index.html" class="btn-volver">← Volver a los Menús</a>
    </form>
  </div>

  <script src="../src/js/fechas.js"></script>
  <script src="../src/js/funciones.js"></script>
  <script src="../src/js/formulario.js" defer></script>
<script>
  // Muestra el body apenas están el HTML y el CSS; a los 2 s se muestra igual, como respaldo
  document.addEventListener('DOMContentLoaded', () => document.body.classList.add('cargada'));
  setTimeout(() => document.body.classList.add('cargada'), 2000);
</script>
</body>

</html>
