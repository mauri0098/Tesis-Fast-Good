<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fast Good - Asignar Cocineros</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/css/global.css">
  <link rel="stylesheet" href="../src/css/ConsultarPedidos.css">
</head>

<body>
<script src="../src/js/roles.js"></script>
<script src="../src/js/guard.js"></script>
<script src="../src/js/adminSidebar.js"></script>

<div class="admin-content">

  <header>
    <div class="container-centrado">
      <div style="display:flex; align-items:center; gap:1rem;">
        <img src="../src/assets/img/logo.webp" alt="Fast Good" style="height:50px; border-radius:4px;" onerror="this.style.display='none'">
        <h1>Asignar Cocineros por Plato</h1>
      </div>
    </div>
  </header>

  <main class="page-container">
    <input type="text" id="BuscarPlato" class="filtro-input" placeholder="Buscar por código, plato o plan..." autocomplete="one-time-code">

    <!-- Aviso: platos que no ve ningún cocinero (sin cocinero propio ni del plan) -->
    <div id="avisoSinCocinero" class="aviso-sin-cocinero"></div>

    <div class="table-wrapper">
      <table class="standard-table">
        <thead>
          <tr>
            <th>Código</th>
            <th>Plato</th>
            <th>Plan</th>
            <th>Cocinero</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="platosBody">
          <tr><td colspan="5" class="loading-text">Cargando datos...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer>
    <p>&copy; 2024 Fast Good - Panel de Administración Tesis</p>
  </footer>

  <style>
    #BuscarPlato { max-width: 360px; margin-bottom: 1rem; }
    .aviso-sin-cocinero {
      display: none; margin-bottom: 1rem;
      background: #fff3cd; color: #856404; border-left: 4px solid #e0a800;
      border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.88rem;
    }
    .aviso-sin-cocinero.visible { display: block; }
    .codigo-plato { font-weight: 700; }
    .plato-nombre-celda { font-weight: 600; text-align: left; }
    /* La tabla es table-layout:fixed: se reparten los anchos para que el select del cocinero tenga lugar */
    .standard-table th:nth-child(1) { width: 9%; }   /* Código */
    .standard-table th:nth-child(2) { width: 25%; }  /* Plato */
    .standard-table th:nth-child(3) { width: 18%; }  /* Plan */
    .standard-table th:nth-child(4) { width: 36%; }  /* Cocinero */
    .standard-table th:nth-child(5) { width: 12%; }  /* Acción */
    .select-cocinero.usa-plan { color: #6c757d; font-style: italic; }
    .select-cocinero.sin-nadie { border-color: #e0a800; color: #856404; }
    .select-cocinero {
      width: 100%;
      padding: 0.4rem 0.5rem;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.82rem;
      background: #fff;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }
    .select-cocinero:focus {
      border-color: #28a745;
      box-shadow: 0 0 0 2px rgba(40, 167, 69, 0.15);
    }
    .btn-guardar {
      background: #28a745; color: white; border: none;
      padding: 0.35rem 0.9rem; border-radius: 6px; cursor: pointer;
      font-size: 0.82rem; font-weight: 600; transition: background 0.2s;
      white-space: nowrap;
    }
    .btn-guardar:hover { background: #218838; }
    .btn-guardar:disabled { background: #adb5bd; cursor: not-allowed; }
    .btn-guardar.guardado { background: #6c757d; }
  </style>

  <script src="../src/js/global.js"></script>
  <script src="../src/js/AsignarCocinero.js"></script>

</div> <!-- /.admin-content -->
</body>

</html>
