<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fast Good — Producción</title>
  <!-- Evita el flash de contenido sin estilos (FOUC): el body se muestra cuando la página terminó de cargar -->
  <style>
    body { visibility: hidden; opacity: 0; transition: opacity 0.15s ease-in; }
    body.cargada { visibility: visible; opacity: 1; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/css/global.css">
  <link rel="stylesheet" href="../src/css/stock.css">
  <link rel="stylesheet" href="../src/css/pedidosCocina.css">
  <link rel="stylesheet" href="../src/css/heladera.css">
</head>

<body>
<script src="../src/js/roles.js"></script>
<script src="../src/js/guard.js"></script>
<script src="../src/js/api.js"></script>
<script src="../src/js/escape.js"></script>
<script src="../src/js/adminSidebar.js"></script>

<div class="admin-content">

  <header>
    <div class="container-centrado">
      <div style="display:flex; align-items:center; gap:1rem;">
        <img src="../src/assets/img/logo.webp" alt="Fast Good" style="height:40px; border-radius:4px;" onerror="this.style.display='none'">
        <h1>Producción</h1>
      </div>
    </div>
  </header>

  <main class="page-container">
    <!-- Aviso de faltantes: solo para quien puede pedir y solo si falta algo (lo maneja heladera.js) -->
    <div id="avisoFaltantes" class="aviso-faltantes" style="display:none">
      <span id="avisoTexto"></span>
      <button class="btn-confirmar" onclick="abrirModalPedido()">Pedir los que faltan</button>
    </div>

    <!-- Dos columnas en escritorio: platos (ancha) y movimientos (angosta). En celular, una debajo de la otra -->
    <div class="heladera-layout">

      <!-- VIANDAS EN HELADERA -->
      <section class="table-wrapper">

        <div class="tabla-header">
          <div class="filtros-container">
            <input type="text" id="filtroNombre" class="filtro-input" placeholder="Buscar plato...">
          </div>
          <div class="acciones-header">
            <button id="btnPedirCocina" class="btn-nuevo-insumo btn-pedir-cocina" onclick="abrirModalPedido()" style="display:none">+ Pedir a cocina</button>
            <button id="btnPendientes" class="btn-secundario" onclick="abrirModalPendientes()">Pendientes de cocina</button>
          </div>
        </div>

        <!-- Filtros por estado: los arma heladera.js con la cantidad de cada uno -->
        <div id="filtrosEstado" class="filtros-estado"></div>

        <table class="standard-table">
          <thead>
            <tr>
              <th>Plato</th>
              <th>Plan</th>
              <th>En stock</th>
              <th>Mínimo</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="heladeraBody">
            <tr>
              <td colspan="6" class="loading-text">Cargando datos...</td>
            </tr>
          </tbody>
        </table>
        <div id="paginacion" class="paginacion"></div>

        <!-- HECHO HOY: platos de pedidos a cocina marcados hechos hoy (lo arma heladera.js) -->
        <div class="hecho-hoy">
          <h2 class="titulo-seccion">Hecho hoy</h2>
          <ul id="listaHechoHoy" class="lista-hecho-hoy">
            <li class="mov-vacio">Cargando...</li>
          </ul>
        </div>

      </section>

      <!-- ÚLTIMOS MOVIMIENTOS (lista compacta con scroll propio) -->
      <aside class="table-wrapper panel-movimientos">
        <h2 class="titulo-seccion">Últimos movimientos</h2>
        <ul id="listaMovimientos" class="lista-movimientos">
          <li class="mov-vacio">Cargando...</li>
        </ul>
      </aside>

    </div>
  </main>

  <footer>
    <p>&copy; 2024 Fast Good - Panel de Administración</p>
  </footer>

  <!-- MODAL: Pedir a cocina (se elige para cuándo y cuántas viandas de cada plato) -->
  <div id="modalPedido" class="modal">
    <div class="modal-content modal-stock modal-pedido">
      <span class="close" onclick="cerrarModalPedido()">&times;</span>
      <h3>Pedir a cocina</h3>

      <!-- Una línea: para cuándo, filtro y cargar rápido -->
      <div class="pedido-controles">
        <label class="control-pedido">Para cuándo
          <input id="pFecha" type="date">
        </label>
        <label class="control-pedido">Mostrar
          <select id="pPlan"></select>
        </label>
        <!-- Cargar rápido: actúa sobre los platos que se ven con el filtro elegido -->
        <div class="control-pedido">
          <span>Cargar rápido</span>
          <div class="carga-rapida">
            <input id="pRapidoCantidad" type="number" min="1" step="1" placeholder="Ej: 5">
            <button type="button" class="btn-rapido" onclick="pedidoACadaUno()">A cada uno</button>
            <button type="button" class="btn-rapido" onclick="pedidoRepartir()">Repartir</button>
            <button type="button" class="btn-rapido btn-limpiar" onclick="pedidoLimpiar()">Limpiar</button>
          </div>
        </div>
      </div>

      <div id="pPlatos" class="lista-pedido"></div>

      <div id="pError" class="modal-error"></div>

      <!-- Siempre visible: total y enviar -->
      <div class="pedido-pie">
        <div class="pedido-total">
          <span id="pTotal" class="pedido-total-numero"></span>
          <span id="pTotalPlatos" class="pedido-total-platos"></span>
        </div>
        <button id="pEnviar" class="btn-confirmar btn-enviar-cocina" onclick="enviarPedido()" disabled>Enviar a cocina</button>
      </div>
    </div>
  </div>

  <!-- MODAL: Pendientes de cocina (lo pedido que todavía no se cocinó, agrupado por cocinero) -->
  <div id="modalPendientes" class="modal">
    <div class="modal-content modal-stock modal-pendientes">
      <span class="close" onclick="cerrarModalPendientes()">&times;</span>
      <h3>Pendientes de cocina</h3>
      <div id="listaPendientes" class="lista-pendientes">
        <p class="mov-vacio">Cargando...</p>
      </div>
    </div>
  </div>

  <!-- MODAL: Descartar viandas -->
  <div id="modalDescarte" class="modal">
    <div class="modal-content modal-stock">
      <span class="close" onclick="cerrarModalDescarte()">&times;</span>
      <h3>Descartar viandas</h3>
      <p id="dInfo"></p>

      <div class="modal-grid">
        <label>Cantidad *</label>
        <input id="dCantidad" type="number" min="1" step="1" placeholder="Ej: 2">

        <label>Motivo *</label>
        <input id="dMotivo" type="text" maxlength="200" placeholder="Ej: Vencidas">
      </div>

      <div id="dError" class="modal-error"></div>

      <div class="modal-actions">
        <button class="btn-cancelar" onclick="cerrarModalDescarte()">Cancelar</button>
        <button id="dConfirmar" class="btn-confirmar" onclick="confirmarDescarte()">Confirmar descarte</button>
      </div>
    </div>
  </div>

  <script src="../src/js/paginacion.js"></script>
  <script src="../src/js/fechas.js"></script>
  <script src="../src/js/pedidosCocina.js"></script>
  <script src="../src/js/heladera.js"></script>

</div> <!-- /.admin-content -->
<script>
  // Muestra el body apenas están el HTML y el CSS; a los 2 s se muestra igual, como respaldo
  document.addEventListener('DOMContentLoaded', () => document.body.classList.add('cargada'));
  setTimeout(() => document.body.classList.add('cargada'), 2000);
</script>
</body>

</html>
