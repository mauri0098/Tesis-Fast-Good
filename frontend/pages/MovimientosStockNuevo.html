<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movimientos de Stock - Fast Good</title>
  <link rel="icon" href="../src/assets/img/logo.webp" type="image/webp"/>
  <!-- Evita el flash de contenido sin estilos (FOUC): el body se muestra cuando la página terminó de cargar -->
  <style>
    body { visibility: hidden; opacity: 0; transition: opacity 0.15s ease-in; }
    body.cargada { visibility: visible; opacity: 1; }
  </style>

  <!-- Letra: Inter, la del panel (20/10; el index sigue con Figtree) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../src/css/global.css" />
  <link rel="stylesheet" href="../src/css/movimientosStockNuevo.css" />
</head>

<body>
  <!-- Arriba: no buscan nada de la página. guard.js revisa el login antes que nada -->
  <script src="../src/js/roles.js"></script>
  <script src="../src/js/guard.js"></script>
  <script src="../src/js/api.js"></script>
  <script src="../src/js/escape.js"></script>
  <script src="../src/js/adminSidebar.js"></script>

  <div class="admin-content">
    <header>
      <div class="container-centrado">
        <div class="logo-titulo">
          <img src="../src/assets/img/logo.webp" alt="Fast Good" class="logo" />
          <h1>Movimientos de Stock</h1>
        </div>
      </div>
    </header>

    <div class="page-container">
      <!-- Botones: type (qué hace), id (para el JS), class (para el CSS) -->
      <div class="acciones-bar">
        <h2>Registro de Entradas y Salidas</h2>
        <div class="acciones-btns">
          <button type="button" id="btnRegistrarCompra" class="btn-compra">
            + Registrar compra
          </button>
          <button type="button" id="btnRegistrarSalida" class="btn-salida">
            − Registrar salida
          </button>
        </div>
      </div>

      <!-- Filtros: el buscador, qué se ve (todo / insumos / viandas), entradas o salidas, y las fechas
           (arrancan en los últimos 30 días; al cambiarlas se piden de nuevo al servidor) -->
      <div class="filtros-bar">
        <input type="text" id="filtroInsumo" placeholder="Buscar insumo o plato" />

        <select id="filtroQue" title="Qué se ve">
          <option value="todo">Todo</option>
          <option value="insumos">Insumos</option>
          <option value="viandas">Viandas</option>
        </select>

        <select id="filtroTipo" title="Entradas o salidas">
          <option value="">Entradas y salidas</option>
          <option value="entrada">Entradas</option>
          <option value="salida">Salidas</option>
        </select>

        <input type="date" id="filtroDesde" title="Desde" />
        <input type="date" id="filtroHasta" title="Hasta" />
      </div>

      <!-- Tabla: el JS llena el tbody. Una fila por movimiento (insumos y viandas, todo junto) -->
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Fecha y Hora</th>
              <th>Origen</th>
              <th>Referencia</th>
              <th>Tipo</th>
              <th>Resumen</th>
              <th>Usuario</th>
              <th>Proveedor</th>
              <th>Motivo</th>
              <th>Detalle</th> <!-- botón Ver / Ocultar -->
            </tr>
          </thead>
          <tbody id="movimientosBody">
            <tr class="empty-row">
              <td colspan="9">Cargando...</td>
            </tr>
          </tbody>
        </table>
      </div>
      <!-- cierra table-wrapper -->

      <!-- Paginación: el JS pone los números de página -->
      <div id="paginacion" class="paginacion"></div>
    </div>
    <!-- cierra page-container -->

    <!-- MODAL COMPRA: arranca oculto (hidden), el JS lo muestra.
         28/10: la caja es una grilla de 4 filas (título · campos · lista · pie): solo la lista se mueve, así el título,
         los campos y los botones quedan siempre a la vista. La lista ya no es una <table>: es una grilla de columnas fijas -->
    <div id="modalCompra" class="modal-fondo" hidden>
      <div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="compraTitulo">
        <!-- Fila 1: el título -->
        <h3 id="compraTitulo">Registrar compra</h3>

        <!-- Fila 2: los campos (Fecha · Proveedor · Categoría · Solo los bajos), en una sola grilla alineada abajo -->
        <div class="compra-campos">
          <!-- Datos de la compra -->
          <div class="compra-datos">
            <label>
              Fecha
              <input type="date" id="compraFecha" />
            </label>
            <label>
              Proveedor (opcional)
              <input type="text" id="compraProveedor" placeholder="Ej: Verdulería Juan" />
            </label>
          </div>
          <!-- cierra compra-datos -->

          <!-- Filtros: categoría y solo los bajos -->
          <div class="compra-filtros">
            <label>
              Categoría
              <select id="compraCategoria">
                <option value="">Todas</option>
              </select>
            </label>
            <label>
              <input type="checkbox" id="compraSoloBajos" />
              Solo los bajos
            </label>
          </div>
          <!-- cierra compra-filtros -->
        </div>
        <!-- cierra compra-campos -->

        <!-- Fila 3: la lista de insumos (lo único que se mueve). Los títulos y cada renglón usan las mismas 6 columnas.
             role="table" / "row" / "columnheader": el lector de pantalla la lee como una tabla -->
        <div class="compra-lista" role="table" aria-label="Insumos de la compra">
          <div class="compra-encabezado" role="row">
            <span role="columnheader">Insumo</span>
            <span role="columnheader">Stock</span>
            <span role="columnheader">Mínimo</span>
            <span role="columnheader">Cantidad</span>
            <span role="columnheader">Unidad</span>
            <span role="columnheader">Vence</span>
          </div>
          <!-- Los renglones: el JS dibuja uno por insumo (renderizarInsumosModal) -->
          <div id="comprasItemsBody" class="compra-renglones" role="rowgroup">
            <div class="compra-renglon-vacio" role="row"><span role="cell">Cargando...</span></div>
          </div>
        </div>
        <!-- cierra compra-lista -->

        <!-- Fila 4: el pie. A la izquierda cuántos se cargaron y el error; a la derecha los botones -->
        <div class="compra-pie">
          <div class="compra-pie-textos">
            <!-- Cuántos insumos tienen cantidad cargada -->
            <p id="compraContador">0 insumos cargados</p>
            <!-- Acá aparecen los errores (vacío al principio) -->
            <p id="compraError" class="compra-error"></p>
          </div>
          <!-- Botones -->
          <div class="modal-botones">
            <button type="button" id="btnCancelarCompra" class="btn-cancelar">Cancelar</button>
            <button type="button" id="btnGuardarCompra" class="btn-compra">Guardar</button>
          </div>
          <!-- cierra modal-botones -->
        </div>
        <!-- cierra compra-pie -->
      </div>
      <!-- cierra modal-caja -->
    </div>
    <!-- cierra modalCompra -->

    <!-- Abajo: buscan elementos de la página, así que van cuando ya está todo armado -->
    <script src="../src/js/paginacion.js"></script>
    <script src="../src/js/fechas.js"></script>
    <script src="../src/js/movimientosStockNuevo.js"></script>
  </div>
  <!-- cierra admin-content -->
  <script>
    // Muestra el body apenas están el HTML y el CSS; a los 2 s se muestra igual, como respaldo
    document.addEventListener('DOMContentLoaded', () => document.body.classList.add('cargada'));
    setTimeout(() => document.body.classList.add('cargada'), 2000);
  </script>
</body>

</html>
