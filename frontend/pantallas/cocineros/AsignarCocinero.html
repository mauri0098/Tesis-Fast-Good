<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fast Good - Asignar Cocineros</title>
  <link rel="icon" href="/src/assets/img/logo.webp" type="image/webp"/>
  <!-- Letra: Inter, la del panel (20/10; el index sigue con Figtree). Poppins queda porque el CSS propio de esta pantalla todavía la usa -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/compartido/global.css">
</head>

<body>
<script src="/compartido/roles.js"></script>
<script src="/compartido/guard.js"></script>
<script src="/compartido/api.js"></script>
<script src="/compartido/adminSidebar.js"></script>

<div class="admin-content">

  <header>
    <div class="container-centrado">
      <div class="titulo-con-logo">
        <img src="/src/assets/img/logo.webp" alt="Fast Good" onerror="this.style.display='none'">
        <h1>Asignar Cocineros por Plato</h1>
      </div>
    </div>
  </header>

  <main class="page-container">
    <input type="text" id="BuscarPlato" class="filtro-input" placeholder="Buscar por código, plato o plan..." autocomplete="one-time-code">

    <!-- Aviso: platos que no ve ningún cocinero (sin cocinero propio ni del plan) -->
    <div id="avisoSinCocinero" class="aviso-sin-cocinero"></div>

    <div class="table-wrapper">
      <table class="standard-table">
        <thead>
          <tr>
            <th>Código</th>
            <th>Plato</th>
            <th>Plan</th>
            <th>Cocinero</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="platosBody">
          <tr><td colspan="5" class="loading-text">Cargando datos...</td></tr>
        </tbody>
      </table>
    </div>
    <!-- (05/11) Los botones de página ‹ 1 2 3 › (los pone crearPaginacion, de paginacion.js; sin filas no se ven, con una sola página queda "‹ 1 ›") -->
    <div id="paginacionPlatos" class="paginacion"></div>
  </main>

  <link rel="stylesheet" href="/pantallas/cocineros/AsignarCocinero.css">

  <script src="/compartido/global.js"></script>
  <!-- (05/11) La paginación que usan todas las tablas del panel (crearPaginacion) -->
  <script src="/compartido/paginacion.js"></script>
  <script src="/pantallas/cocineros/AsignarCocinero.js"></script>

</div> <!-- /.admin-content -->
<script>
  // Muestra el body apenas están el HTML y el CSS; a los 2 s se muestra igual, como respaldo
  document.addEventListener('DOMContentLoaded', () => document.body.classList.add('cargada'));
  setTimeout(() => document.body.classList.add('cargada'), 2000);
</script>
</body>

</html>
