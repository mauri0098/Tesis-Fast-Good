<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión - Fast Good</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/webp" href="./src/assets/img/logo.webp">

  <link rel="stylesheet" href="./src/css/global.css">
  <link rel="stylesheet" href="./src/css/login.css">
</head>

<body>

  <!-- Página de inicio como fondo -->
  <iframe src="index.html" id="bg-frame" tabindex="-1" aria-hidden="true"></iframe>
  <!-- Capa oscura semitransparente encima del iframe -->
  <div class="bg-overlay"></div>

  <div class="scroll-wrapper">
  <div class="login-container">

    <!-- Botón cerrar → vuelve al inicio -->
    <a href="index.html" class="btn-cerrar-login" title="Volver al inicio">✕</a>

    <div class="login-header">
      <img src="src/assets/img/logo.webp" alt="Fast Good Logo" />
      <h1>FAST GOOD</h1>
      <p>Bienvenido</p>
    </div>

    <!-- Tabs -->
    <div class="tab-buttons">
      <button class="tab-btn active" id="tabLogin" onclick="mostrarTab('login')">Iniciar Sesión</button>
      <button class="tab-btn" id="tabRegistro" onclick="mostrarTab('registro')">Crear Cuenta</button>
    </div>

    <!-- FORMULARIO LOGIN -->
    <div id="seccionLogin">
      <form id="loginForm">
        <div class="form-group">
          <label for="username">👤 Usuario o Email</label>
          <input type="text" id="username" name="username" required placeholder="tu usuario o email" />
          <div class="error-message" id="usernameError"></div>
        </div>

        <div class="form-group">
          <label for="password">🔐 Contraseña</label>
          <input type="password" id="password" name="password" required placeholder="••••••••" />
          <div class="error-message" id="passwordError"></div>
        </div>

        <div class="error-message" id="loginError"></div>
        <div class="loading" id="loadingSpinner">Iniciando sesión...</div>

        <button type="submit" class="login-btn">Iniciar Sesión</button>
      </form>

      <div style="text-align:center; margin-top:0.9rem;">
        <button type="button" class="btn-olvide" onclick="abrirModalRecuperar()">
          ¿Olvidaste tu contraseña?
        </button>
      </div>
    </div>

    <!-- FORMULARIO REGISTRO -->
    <div id="seccionRegistro" style="display: none;">
      <form id="registroForm">
        <div class="form-group">
          <label for="reg-nombre">Nombre</label>
          <input type="text" id="reg-nombre" required placeholder="Tu nombre" />
        </div>

        <div class="form-group">
          <label for="reg-apellido">Apellido</label>
          <input type="text" id="reg-apellido" required placeholder="Tu apellido" />
        </div>

        <div class="form-group">
          <label for="reg-direccion">Dirección</label>
          <input type="text" id="reg-direccion" required placeholder="Tu dirección" />
        </div>

        <div class="form-group">
          <label for="reg-telefono">Teléfono</label>
          <input type="tel" id="reg-telefono" required placeholder="Tu teléfono" />
        </div>

        <div class="form-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" required placeholder="tu@email.com" />
        </div>

        <div class="form-group">
          <label for="reg-password">Contraseña</label>
          <input type="password" id="reg-password" required placeholder="••••••••" minlength="6" />
        </div>

        <div class="error-message" id="registroError"></div>
        <div class="success-message" id="registroExito"></div>
        <div class="loading" id="loadingRegistro">Creando cuenta...</div>

        <button type="submit" class="login-btn">Crear Cuenta</button>
      </form>
    </div>
  </div>
  </div><!-- fin scroll-wrapper -->

  <!-- MODAL: Recuperar Contraseña -->
  <div id="modalRecuperar" class="modal">
    <div class="modal-content" style="max-width:420px; margin:15% auto;">
      <span class="close" onclick="cerrarModalRecuperar()">&times;</span>
      <h3 style="font-size:1.3rem; margin-bottom:0.5rem;">Recuperar contraseña</h3>
      <p style="font-size:0.9rem; color:#666; margin-bottom:1.2rem;">
        Ingresá tu email y te enviaremos una contraseña temporal.
      </p>

      <div class="form-group" style="margin-bottom:1rem;">
        <label for="recuperarEmail">📧 Email registrado</label>
        <input type="email" id="recuperarEmail" placeholder="tu@email.com" autocomplete="off" />
      </div>

      <div class="error-message"   id="recuperarError"></div>
      <div class="success-message" id="recuperarExito"></div>
      <div class="loading"         id="recuperarLoading">Enviando...</div>

      <button type="button" class="login-btn" id="btnEnviarRecuperar"
              onclick="enviarRecuperacion()" style="margin-top:0.5rem;">
        Enviar contraseña temporal
      </button>
    </div>
  </div>

  <script src="src/js/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', manejarLogin);
    document.getElementById('registroForm').addEventListener('submit', manejarRegistro);

    function mostrarTab(tab) {
      const esLogin = tab === 'login';
      document.getElementById('tabLogin').classList.toggle('active', esLogin);
      document.getElementById('tabRegistro').classList.toggle('active', !esLogin);
      document.getElementById('seccionLogin').style.display = esLogin ? 'block' : 'none';
      document.getElementById('seccionRegistro').style.display = esLogin ? 'none' : 'block';
    }

    // ── Modal recuperar contraseña ──────────────────────────────────────────
    function abrirModalRecuperar() {
      document.getElementById('recuperarEmail').value = '';
      document.getElementById('recuperarError').classList.remove('show');
      document.getElementById('recuperarExito').classList.remove('show');
      document.getElementById('recuperarLoading').classList.remove('show');
      document.getElementById('modalRecuperar').style.display = 'block';
    }

    function cerrarModalRecuperar() {
      document.getElementById('modalRecuperar').style.display = 'none';
    }

    // Cerrar al hacer clic fuera del contenido
    window.addEventListener('click', function (e) {
      if (e.target === document.getElementById('modalRecuperar')) cerrarModalRecuperar();
    });

    async function enviarRecuperacion() {
      const emailEl   = document.getElementById('recuperarEmail');
      const errorEl   = document.getElementById('recuperarError');
      const exitoEl   = document.getElementById('recuperarExito');
      const loadingEl = document.getElementById('recuperarLoading');
      const btnEl     = document.getElementById('btnEnviarRecuperar');
      const email     = emailEl.value.trim();

      errorEl.classList.remove('show');
      exitoEl.classList.remove('show');

      if (!email) {
        errorEl.textContent = 'Ingresá tu email.';
        errorEl.classList.add('show');
        return;
      }

      loadingEl.classList.add('show');
      btnEl.disabled = true;

      try {
        const res  = await fetch('/api/recuperar-password', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email })
        });
        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.error || 'Ocurrió un error. Intentá de nuevo.';
          errorEl.classList.add('show');
        } else {
          exitoEl.textContent = data.mensaje || 'Te enviamos una contraseña temporal a tu correo.';
          exitoEl.classList.add('show');
          emailEl.value = '';
          // Cerrar el modal automáticamente después de 3 segundos
          setTimeout(cerrarModalRecuperar, 3000);
        }
      } catch {
        errorEl.textContent = 'No se pudo conectar con el servidor.';
        errorEl.classList.add('show');
      } finally {
        loadingEl.classList.remove('show');
        btnEl.disabled = false;
      }
    }
  </script>
</body>

</html>
